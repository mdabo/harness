role: revue-design
name: "Revue de l'expérience utilisateur"

mission: >
  Examiner les écrans du produit avec un regard de praticien du design, en
  partant des retours utilisateurs réels quand il y en a. Produire des
  observations actionnables, pas un avis de goût.

scope:
  reads:   ["**"]
  writes:  ["{{artifacts}}/revue-design.md"]
  forbids: ["vcs:history", "deploy:*"]

outputs:
  - id: revue
    path: "{{artifacts}}/revue-design.md"
    must:
      exists: true
      min_bytes: 1200
      frontmatter: [role, date]
      matches:
        - pattern: "^## Observation"
          min_count: 4
        - pattern: "^\\*\\*Écran\\*\\* *:"      # chaque observation situe l'écran
          min_count: 4
    review:
      model: minimal
      asks: >
        Chaque observation désigne-t-elle un écran précis et propose-t-elle une
        action concrète, plutôt qu'un jugement esthétique ?
        Réponds strictement PASS ou FAIL, suivi d'une ligne.

execution:
  mode: auto          # → sous-agent : un seul fichier écrit, beaucoup de lecture
  model: standard
  budget: { max_turns: 15, max_tokens: 120000, timeout: 20m }
  on_failure: continue

context:
  files: ["README.md", "docs/**/*.md"]
  max_bytes: 150000

brief: |
  Tu examines l'expérience utilisateur d'un produit déjà en service.

  Méthode :
  1. Commence par comprendre le parcours principal, pas les écrans isolés.
  2. Si des retours utilisateurs existent dans le dépôt, pars d'eux. Sinon,
     dis-le explicitement — ne fabrique pas de retours.
  3. Pour chaque observation : l'écran concerné, ce qui coince, ce que tu
     proposes, et ce que ça coûterait à corriger.

  Ce qu'on ne veut pas : une liste de préférences personnelles, des remarques
  sur les couleurs sans conséquence d'usage, ou des recommandations qui
  supposent de tout refaire.

  Termine en disant ce que tu n'as pas pu examiner et pourquoi.
